name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        run: |
          cd mobile
          flet build apk --project "IEYFWW" --org "ng.ieyfww" --product "IEYFWW"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ieyfww-apk
          path: mobile/build/apk/*.apk
