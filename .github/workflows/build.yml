name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install flet

      - name: Build APK
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1
          PYTHONUTF8: 1
        run: |
          cd mobile
          flet build apk --project "IEYFWW" --org "ng.ieyfww" --product "IEYFWW" --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ieyfww-apk
          path: mobile/build/apk/*.apk
          if-no-files-found: error
